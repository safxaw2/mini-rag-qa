[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling==2.76.0",
    "fastapi==0.135.1",
    "markdownify==1.2.2",
    "openai==2.29.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "tenacity==9.1.4",
    "torch",
    "torchvision",
    "uvicorn==0.42.0",
]

[tool.uv]
python-install-mirror = "https://mirrors.ustc.edu.cn/github-release/astral-sh/python-build-standalone/"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
